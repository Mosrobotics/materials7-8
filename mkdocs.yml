site_name: Mosrobotics — учебные материалы
site_url: https://mosrobotics.github.io/materials7-8/
site_description: Конспекты и материалы по робототехнике для групп А и С
repo_url: https://github.com/Mosrobotics/materials7-8
repo_name: Mosrobotics/materials7-8
edit_uri: edit/main/docs/

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  font:
    text: Manrope
    code: JetBrains Mono
  icon:
    logo: material/robot-industrial
    repo: fontawesome/brands/github
    edit: material/pencil

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Главная: index.md
  - Группа А: group-a/index.md
  - Группа С:
      - group-c/index.md
      - Теория:
          - group-c/theory/index.md
          - Светодиод и резистор: group-c/theory/led-resistor.md
      - Основы программирования:
          - group-c/programming/index.md
          - Маячок: group-c/programming/blink.md
      - Полезные файлы: group-c/files.md
      - Полезные ссылки: group-c/links.md
